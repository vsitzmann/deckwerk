# Per-push gate: deterministic checks block merges; real Electron suites still
# run and report regressions without making runner-load/input-driver flakes the
# repository's required status check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this job id stable: branch protection requires the `test` context.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg, for the reference deck's clip in a codec browsers cannot play.
      - name: Install system dependencies (ffmpeg)
        uses: ./.github/actions/electron-system-deps
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      # The Keynote and PowerPoint importers against their checked-in
      # reference decks. Deterministic, so they gate merges; run alone (the
      # serial config) so importer start-up cannot be starved by a busy pool.
      - name: Importer tests
        run: npm run test:importers

  # Real Electron under Xvfb, including the Chromium media transfer budgets.
  # Required, like `test`: a red browser run blocks the merge, so a flaky
  # suite is a bug to fix, not noise to read past.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system dependencies (Electron + ffmpeg)
        uses: ./.github/actions/electron-system-deps
      - run: npm ci
      - name: Configure Electron's SUID sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Browser tests
        env:
          # Bare Xvfb has no compositor. Pixel-capture suites use this to skip
          # instead of waiting forever for a frame that cannot be produced.
          CI_NO_WINDOW_MANAGER: "1"
        run: xvfb-run -a --server-args="-screen 0 2560x1440x24" npm run test:browser

  # Suites that share machine-wide state (the OS clipboard, presentation
  # windows) one at a time. Still advisory: the clipboard and focus paths are
  # not deterministic enough on shared Linux runners to block every merge.
  serial:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install system dependencies (Electron + ffmpeg)
        uses: ./.github/actions/electron-system-deps
      - run: npm ci
      - name: Configure Electron's SUID sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Serial tests (advisory)
        env:
          CI_NO_WINDOW_MANAGER: "1"
        run: xvfb-run -a --server-args="-screen 0 2560x1440x24" npm run test:serial

  # The media transfer budgets and the editing latency budgets in real
  # Safari. Its media stack (AVFoundation) fetches and re-fetches video, and
  # its painting stalls, in ways Chromium never does, and it exists only on
  # macOS, so this is the one place they run. Advisory: it cannot run on
  # every platform, and hosted macOS runners are slow and Safari automation
  # fragile there. The Chromium half of each suite runs in `browser`, which
  # is required.
  safari:
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Allow Safari to be automated
        run: sudo safaridriver --enable
      - name: Media transfer budgets in Safari (advisory)
        env:
          RUN_SAFARI_MEDIA_BUDGET: "1"
        run: npx vitest run --config vitest.browser.config.ts test/mediaTransferBudgetBrowser.test.ts -t "Safari"
      # Typing, stepping through slides and a collaborator's edits, timed in
      # real Safari: its painting is where the editor was slow while Chromium
      # was quick. The Chromium half of the suite runs in `browser`.
      - name: Editing latency in Safari (advisory)
        if: ${{ !cancelled() }}
        env:
          RUN_SAFARI_LATENCY: "1"
        run: npx vitest run --config vitest.serial.config.ts test/editingLatencyBrowser.test.ts -t "Safari"
