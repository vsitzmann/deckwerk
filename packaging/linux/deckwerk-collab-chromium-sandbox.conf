# systemd drop-in for a DeckWerk collaboration server (`npm run collab`) run
# under the usual service hardening: NoNewPrivileges, RestrictNamespaces=yes,
# and a @system-service syscall filter that denies @privileged and @mount.
#
# The server lays out every page an agent saves, renders every PNG and checks
# every web page in headless Chromium (Electron), and Chromium refuses to run
# without its own sandbox. On Linux that sandbox lives in user, pid and net
# namespaces and needs chroot(2) and capset(2) to enter them — exactly what
# that hardening forbids, so every agent save, render and page check fails.
# This allows those and nothing else; every other setting of the unit stands.
# (A setuid chrome-sandbox is no alternative: NoNewPrivileges ignores it.)
#
#   sudo install -D -m 0644 packaging/linux/deckwerk-collab-chromium-sandbox.conf \
#     /etc/systemd/system/deckwerk-collab.service.d/chromium-sandbox.conf
#   sudo systemctl daemon-reload && sudo systemctl restart deckwerk-collab
#
# test/support/collabServerProcess.ts runs the agent suites under this policy.

[Service]
RestrictNamespaces=user pid net
SystemCallFilter=
SystemCallFilter=@system-service chroot
SystemCallFilter=~@chown @clock @cpu-emulation @debug @module @obsolete @raw-io @reboot @resources @swap _sysctl acct bpf fanotify_init fanotify_mark fsconfig fsmount fsopen fspick mount mount_setattr move_mount nfsservctl open_by_handle_at open_tree pivot_root quotactl quotactl_fd setdomainname setfsuid setfsuid32 setgroups setgroups32 sethostname setresuid setresuid32 setreuid setreuid32 setuid setuid32 umount umount2 vhangup
