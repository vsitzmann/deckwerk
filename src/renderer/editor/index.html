<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; font-src 'self' data: deck:; connect-src 'self' data: ws://127.0.0.1:*; frame-src http://127.0.0.1:* deck:; img-src 'self' deck: data:; media-src 'self' deck:; style-src 'self' 'unsafe-inline' deck:; script-src 'self' 'wasm-unsafe-eval'" />
    <title>DeckWerk</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar"></header>
      <div id="body">
        <aside id="rail"></aside>
        <main id="canvas"></main>
        <aside id="side">
          <nav id="side-tabs"></nav>
          <div id="side-panels">
            <div id="inspector" class="side-panel"></div>
            <div id="themePanel" class="side-panel" hidden></div>
            <div id="timeline" class="side-panel" hidden></div>
            <div id="history" class="side-panel" hidden></div>
            <div id="media" class="side-panel" hidden></div>
            <div id="theme" class="side-panel" hidden></div>
          </div>
        </aside>
      </div>
      <footer id="status" data-native-copy></footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
